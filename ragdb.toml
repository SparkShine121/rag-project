# ragdb 配置（2026-09-08 定版）
# 覆盖方式优先级：环境变量 RAGDB_* > 本文件 > 内置默认值
# 改动需 ragdb rebuild 的参数在注释中标了 ⚠️
# 完整语义见 docs/superpowers/specs/2026-09-08-rag-database-design.md §5.1

# ── 路径 ──────────────────────────────────────────────
# 知识库根目录（全链路只读，绝不写入）
vault_path = "~/Documents/Obsidian Vault"
# 向量库 / 同步状态库 / 锁文件的存放目录
data_dir = "~/Library/Application Support/ragdb"

# ── 服务 ─────────────────────────────────────────────
# FastAPI 监听端口（固定绑定 127.0.0.1，不暴露公网）
port = 8770
# 后台增量同步周期（秒）；0 = 关闭循环，仅手动/CLI 触发
interval_secs = 30

# ── 检索 ─────────────────────────────────────────────
# 向量召回候选数（进重排前的池子）
recall_k = 20
# 最终返回条数
top_k = 5
# 交叉编码精排只取稠密分前 N 名——延迟主项（M4 实测约 100ms/对：
# 5 → 0.7-1.2s，10 → 2.4s；冒烟验证两者 top1 一致）
rerank_top_k = 5
# 单次检索返回内容的 token 预算（超出从低分笔记起裁剪）
token_budget = 3000

# ── 切块（改动需 ragdb rebuild ⚠️）────────────────────
[chunk]
# 短于此字符数的段落并入上级块
min_chars = 100
# 超过此 token 数的节按段落二次切分
max_tokens = 500
# 整笔记 token 低于此值时整篇返回（不按块拆）
short_note_tokens = 600

# ── 模型（改动需 ragdb rebuild ⚠️，向量维度与模型绑定）──
# 嵌入模型（输出 1024 维，维度自动推导建表）
embed_model = "BAAI/bge-m3"
# 重排模型
rerank_model = "BAAI/bge-reranker-v2-m3"
# 推理设备：mps / cpu（FlagEmbedding 需显式传 devices，勿依赖自动探测）
device = "mps"
# 推理精度：float16（MPS 数值不稳时降 float32）
dtype = "float16"
# 嵌入批大小
embed_batch = 32
# 模型空闲卸载 TTL（秒，v1.3）：serve 与 stdio MCP（ragdb-mcp）进程空闲超过该时长
# 自动释放模型权重（footprint 实测 3.7GB → 1.4GB，省 62%）；再次检索自动重载（~19s）。
# stdio MCP 进程仅释放权重、绝不退出（保持 agent 会话连接）。0 = 常驻不卸载
unload_idle_secs = 1800

# ── 知识来源（v1.1 多渠道 / v1.2 多类型）───────────────
# [ingest] 过滤配置（folder/github 源生效；obsidian 恒为 md-only）
# include_exts 默认 18 项（.md .py .ts .js .tsx .go .rs .java .c .h .cpp .sh .sql .toml .yaml .yml .json .pdf）
# max_file_mb = 50              # 单文件大小上限
# max_files_per_source = 5000   # 来源文件数上限（达到即在同步报告中提示）
# exclude_dirs = [".git", "node_modules", "dist", "build", "__pycache__", ".venv", "venv", ".trash", ".obsidian"]
# 每个 [[sources]] 块 = 一个知识源；name 即检索结果路径的前缀。
# 未配置任何 sources 时，自动以 vault_path 作为名为 "obsidian" 的单一来源。
# 来源增删/改名后的首次同步会自动清理孤儿索引，无需手动 rebuild。

# 示例一：Obsidian vault（当前生效，type 可省略）
[[sources]]
name = "obsidian"
type = "obsidian"
path = "~/Documents/Obsidian Vault"

# 示例二：GitHub 仓库（复制后改为你的仓库；一期仅索引 .md 文件）
# [[sources]]
# name = "myrepo"                # 检索路径前缀，如 myrepo/README.md
# type = "github"
# repo = "owner/repo"            # 公开或私有均可；一期索引 .md，v1.2 按白名单收多类型
# ref = "main"                   # 分支 / tag / commit
# token_env = "GITHUB_TOKEN"     # 私有仓库必填：从该环境变量读 token；公开仓库可删掉本行

# 示例三：本地任意目录（folder，多类型：md/代码/PDF）
# [[sources]]
# name = "docs"                  # 检索路径前缀，如 docs/报告.pdf > 第 1 页
# type = "folder"
# path = "~/Documents/资料库"    # 按 [ingest] 白名单遍历

# 实际启用的 GitHub 来源（2026-09-14 接入，私有仓库，token 从环境变量 GITHUB_TOKEN 读取）
[[sources]]
name = "myrepo"
type = "github"
repo = "SparkShine121/my_bookstore"
ref = "main"
token_env = "GITHUB_TOKEN"
